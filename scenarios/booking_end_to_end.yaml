id: booking_end_to_end
description: >
  End-to-end booking. The first yes holds option 1. A second explicit yes
  books that slot. "Sí, enviá el email." asks for the invite. The recruiter
  step is a simulated approval inside this scenario, not a person at a desk.
  PASS still needs the booking, the invite in the outbox, that approval,
  and clean invariants.
candidate_id: cand-uno
lang: es
provider: scripted
allowed_tools:
- list_availability
- hold_slot
- book_slot
- send_invite_email
- get_booking
- release_hold
- search_faq
steps:
- role: user
  text: Hola, soy Candidata Uno. Quiero una entrevista con Ana Luz el 14 de abril
    de 2026. Mi zona es America/Argentina/Buenos_Aires.
- role: user
  text: Sí, confirmo.
- role: user
  text: Sí, confirmo ese horario exacto.
- role: user
  text: Sí, enviá el email.
- role: recruiter
  decision: approve
expect:
  booked: true
  outbox_min: 1
  terminal_in:
  - completed
