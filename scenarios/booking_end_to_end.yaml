id: booking_end_to_end
description: >
  End-to-end booking. The first yes holds option 1. A second explicit yes
  books that slot. "Yes, send the email." asks for the invite. The recruiter
  step is a simulated approval inside this scenario, not a person at a desk.
  PASS still needs the booking, the invite in the outbox, that approval,
  and clean invariants.
candidate_id: cand-uno
lang: en
provider: scripted
allowed_tools:
- list_availability
- hold_slot
- book_slot
- send_invite_email
- get_booking
- release_hold
- search_faq
steps:
- role: user
  text: Hello, I am Candidate One. I want an interview with Ana Luz on April 14,
    2026. My time zone is America/Argentina/Buenos_Aires.
- role: user
  text: Yes, I confirm.
- role: user
  text: Yes, I confirm that exact time.
- role: user
  text: Yes, send the email.
- role: recruiter
  decision: approve
expect:
  booked: true
  outbox_min: 1
  terminal_in:
  - completed
