name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: python -m pip install -e ".[dev]"
      - name: lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: types
        run: python -m mypy src
      - name: tests and coverage
        run: python -m pytest
      - name: eval gate
        run: python -m scheduling_agent eval
      - name: forced regression must fail
        run: |
          if python -m scheduling_agent eval --regression; then
            echo "expected the regression gate to exit 1"
            exit 1
          fi
      - name: secret scan
        run: python -m scheduling_agent.secretscan
