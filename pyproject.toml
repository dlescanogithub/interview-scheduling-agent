[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scheduling-agent"
version = "0.1.0"
description = "Synthetic lab: interview scheduling agent with gates, invariants and a mock calendar."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Diego Lescano" }]
dependencies = ["PyYAML>=6.0.1"]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6.9",
  "types-PyYAML>=6.0",
]

[project.scripts]
scheduling-agent = "scheduling_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scheduling_agent = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/scheduling_agent/secretscan.py" = []

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["scheduling_agent"]
warn_unused_ignores = true
disallow_any_generics = true

[tool.pytest.ini_options]
addopts = "--cov=scheduling_agent --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["scheduling_agent"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = ["if __name__ == .__main__.:", "raise NotImplementedError"]
