id: long_rambling
description: A long note still yields one booking question path.
candidate_id: cand-uno
lang: en
provider: scripted
allowed_tools:
- list_availability
- hold_slot
- book_slot
- send_invite_email
- get_booking
- release_hold
- search_faq
steps:
- role: user
  text: 'Hello, sorry for the long note. I have been thinking about the trip, the
    notebook, the coffee on the corner, and how to organize the week. Also about a
    quiet room, with no hurry. The request is simple: I want an interview with Bruno
    Paz on April 16, 2026 in the morning. My time zone is UTC. Thanks for reading.'
- role: user
  text: Yes, I confirm.
- role: recruiter
  decision: approve
expect:
  booked: true
  outbox_min: 1
  terminal_in:
  - completed
