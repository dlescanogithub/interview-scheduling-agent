id: happy_path
description: Book with an explicit yes and a recruiter-approved invite.
candidate_id: cand-one
lang: en
provider: scripted
allowed_tools:
- list_availability
- hold_slot
- book_slot
- send_invite_email
- get_booking
- release_hold
- search_faq
steps:
- role: user
  text: Hello, I am Candidate One. I want an interview with Ana Luz on April 14,
    2026. My time zone is America/Argentina/Buenos_Aires.
- role: user
  text: Yes, I confirm.
- role: recruiter
  decision: approve
expect:
  booked: true
  outbox_min: 1
  terminal_in:
  - completed
